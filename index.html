<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sol Radar · رادار سولانا</title>
<meta name="description" content="Automated Solana analysis for Binance with buy and sell signals, stop loss and targets · تحلیل خودکار سولانا روی بایننس">
<meta name="theme-color" content="#F1F3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A111D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sol Radar">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,400..700&family=Vazirmatn:wght@400..900&display=swap">
<style>
/* Layout: one phone-width column. Sticky price strip on top, four views, a bottom tab bar.
   Identity: "sol" is the sun — amber is the brand accent; green/red stay purely semantic (buy/sell).
   Works right-to-left (Persian) and left-to-right (English). */
:root {
  --bg: #F1F3F7;
  --card: #FFFFFF;
  --sunk: #E8ECF2;
  --line: #D8DEE8;
  --ink: #0F1A2A;
  --mute: #546176;
  --faint: #8792A5;
  --sun: #B26700;
  --sun-soft: #FCEBD0;
  --buy: #0B8A5E;
  --buy-soft: #DCF2E8;
  --sell: #C9283E;
  --sell-soft: #FAE2E5;
  --on-st: #FFFFFF;
  --shadow: 0 1px 2px rgba(15, 26, 42, .06), 0 8px 24px rgba(15, 26, 42, .07);
  --fa: "Vazirmatn", "Vazir", Tahoma, "Segoe UI", system-ui, sans-serif;
  --mono: "Martian Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A111D; --card: #111B2B; --sunk: #0D1625; --line: #1F2C41; --ink: #E6ECF5; --mute: #98A5B8; --faint: #66748B;
    --sun: #F2B23E; --sun-soft: rgba(242, 178, 62, .13); --buy: #2FD39A; --buy-soft: rgba(47, 211, 154, .12);
    --sell: #FF6479; --sell-soft: rgba(255, 100, 121, .13); --on-st: #08111C;
    --shadow: 0 1px 0 rgba(255, 255, 255, .03), 0 12px 32px rgba(0, 0, 0, .38); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A111D; --card: #111B2B; --sunk: #0D1625; --line: #1F2C41; --ink: #E6ECF5; --mute: #98A5B8; --faint: #66748B;
  --sun: #F2B23E; --sun-soft: rgba(242, 178, 62, .13); --buy: #2FD39A; --buy-soft: rgba(47, 211, 154, .12);
  --sell: #FF6479; --sell-soft: rgba(255, 100, 121, .13); --on-st: #08111C;
  --shadow: 0 1px 0 rgba(255, 255, 255, .03), 0 12px 32px rgba(0, 0, 0, .38); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.7 var(--fa); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
a { color: inherit; }
button, input { font: inherit; color: inherit; }
h1, h2, h3 { text-wrap: balance; }
.wrap { max-width: 560px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; font-stretch: 85%; font-weight: 500; direction: ltr; unicode-bidi: isolate; letter-spacing: -.01em; }
.up { color: var(--buy); } .down { color: var(--sell); } .muted { color: var(--mute); } .faint { color: var(--faint); }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; border-radius: 6px; }

/* ---------- header ---------- */
.top { position: sticky; top: 0; z-index: 30; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); border-bottom: 1px solid var(--line); }
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .top { background: color-mix(in srgb, var(--bg) 84%, transparent); -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px); }
}
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px 2px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 34px; height: 34px; flex: none; }
.brand b { display: block; font-weight: 850; font-size: 17px; line-height: 1.25; letter-spacing: -.01em; }
.brand small { display: block; color: var(--mute); font-size: 12px; line-height: 1.3; }
.bar-end { display: flex; align-items: center; gap: 8px; flex: none; }
.lang { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 3px 11px; font: 700 12px/1.6 var(--fa); color: var(--ink); cursor: pointer; white-space: nowrap; }
.lang:hover { border-color: var(--mute); }
.status { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--mute); background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 3px 10px; white-space: nowrap; }
.status i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
.status[data-s="live"] i { background: var(--buy); box-shadow: 0 0 0 3px var(--buy-soft); animation: pulse 2.4s ease-in-out infinite; }
.status[data-s="poll"] i { background: var(--sun); }
.status[data-s="off"] i { background: var(--sell); }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px transparent; } }
.quote { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 0 12px; padding-block: 2px 10px; }
.px { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
.px .big { font-size: 33px; font-weight: 600; letter-spacing: -.035em; line-height: 1.2; }
.chg { font-size: 12.5px; padding: 1px 8px; border-radius: 6px; background: var(--sunk); }
.chg.up { background: var(--buy-soft); } .chg.down { background: var(--sell-soft); }
.hl { grid-column: 1 / -1; color: var(--mute); font-size: 12px; }
.spark { grid-column: 2; grid-row: 1; width: 108px; height: 40px; }

/* ---------- layout ---------- */
main { padding-block: 16px calc(100px + env(safe-area-inset-bottom, 0px)); }
.view { display: grid; gap: 14px; }
.sec { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 12px 2px -4px; }
.sec h2 { margin: 0; font-size: 13.5px; font-weight: 800; color: var(--mute); }
.sec span { font-size: 12px; color: var(--faint); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; min-width: 0; }
.card p { margin: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); font-weight: 750; font-size: 14px; text-decoration: none; cursor: pointer; }
.btn.primary { background: var(--st, var(--ink)); border-color: transparent; color: var(--on-st); }
.btn.ghost { background: transparent; }
.btn:active { transform: translateY(1px); }

/* ---------- signal ticket ---------- */
.ticket { --st: var(--sun); --st-soft: var(--sun-soft); background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
.ticket[data-st="buy"] { --st: var(--buy); --st-soft: var(--buy-soft); }
.ticket[data-st="sell"] { --st: var(--sell); --st-soft: var(--sell-soft); }
.t-head { background: var(--st-soft); padding: 18px 18px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; }
.t-word, .t-name { grid-column: 1; }
.t-word { margin: 0; font-size: 52px; font-weight: 900; line-height: 1; color: var(--st); letter-spacing: -.02em; }
:root[lang="en"] .t-word { letter-spacing: .01em; }
.t-name { font-weight: 750; font-size: 15px; }
.t-meta { grid-column: 1 / -1; color: var(--mute); font-size: 12.5px; line-height: 1.6; }
.ring { grid-column: 2; grid-row: 1 / span 2; width: 68px; height: 68px; }
.ring text { font-family: var(--mono); font-size: 15px; font-weight: 600; fill: var(--ink); }
.ring .lbl { font-family: var(--fa); font-size: 8.5px; font-weight: 600; fill: var(--mute); }
:root[lang="en"] .ring .lbl { font-size: 6.8px; }
.perf { position: relative; height: 0; border-top: 2px dashed var(--line); margin-inline: 14px; }
.perf::before, .perf::after { content: ""; position: absolute; top: -10px; width: 18px; height: 18px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); }
.perf::before { right: -24px; } .perf::after { left: -24px; }
.levels { padding: 4px 18px 0; }
.lv { display: grid; grid-template-columns: minmax(0, 1fr) auto 56px 34px; align-items: baseline; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.lv:last-child { border-bottom: 0; }
.lv .k { color: var(--mute); font-size: 13.5px; white-space: nowrap; }
.lv.entry .v { font-size: 15px; }
.lv .v { font-size: 16px; text-align: end; }
.lv .d { font-size: 12px; color: var(--mute); text-align: end; }
.lv .r { font-size: 11px; color: var(--faint); text-align: end; }
.lv.stop .v { color: var(--sell); } .lv.tp .v, .lv.rebuy .v { color: var(--buy); }
.lv.done .v { text-decoration: line-through; text-decoration-thickness: 1px; opacity: .55; }
.lv.done .k::after { content: " ✓"; color: var(--buy); font-weight: 800; }
.track { position: relative; height: 38px; margin: 12px 26px 0; direction: ltr; }
.track .rail { position: absolute; inset-inline: 0; top: 12px; height: 6px; border-radius: 3px; background: var(--sunk); }
.track .fill { position: absolute; top: 12px; height: 6px; border-radius: 3px; }
.track .tick { position: absolute; top: 8px; width: 2px; height: 14px; background: var(--faint); transform: translateX(-1px); border-radius: 1px; }
.track .lab { position: absolute; top: 24px; font-size: 10.5px; color: var(--faint); transform: translateX(-50%); white-space: nowrap; }
.track .me { position: absolute; top: 5px; width: 20px; height: 20px; border-radius: 50%; background: var(--card); border: 3px solid var(--st); transform: translateX(-50%); box-shadow: var(--shadow); }
.t-actions { display: flex; gap: 8px; padding: 14px 18px 0; flex-wrap: wrap; }
.t-actions .btn { flex: 1 1 140px; }
.note { margin: 12px 18px 0; padding: 10px 12px; border-radius: 10px; background: var(--sun-soft); font-size: 13px; line-height: 1.7; }
.why { padding: 12px 18px 18px; }
.why h3 { margin: 4px 0 8px; font-size: 13px; color: var(--mute); font-weight: 800; }
.why ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.why li { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 8px; font-size: 14px; line-height: 1.65; }
.why li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--buy); margin-top: 8px; }
.why li.neg::before { background: var(--sell); border-radius: 2px; transform: rotate(45deg); }
.facts { padding: 6px 18px 6px; }
.fact { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; align-items: baseline; }
.fact:last-child { border-bottom: 0; }
.fact .k { color: var(--mute); font-size: 13.5px; }
.fact .v { text-align: end; }
.sweep { width: 116px; height: 116px; border-radius: 50%; margin: 18px auto 8px; border: 1px solid var(--line);
  background: conic-gradient(from 0deg, var(--sun-soft), transparent 28%), repeating-radial-gradient(circle, transparent 0 17px, var(--line) 17px 18px);
  animation: spin 2.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- radar ---------- */
.radar { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 16px; align-items: center; }
@media (max-width: 400px) { .radar { grid-template-columns: 1fr; } }
.gauge { width: 100%; max-width: 190px; justify-self: center; display: block; }
.gauge .val { font-family: var(--mono); font-size: 20px; font-weight: 600; fill: var(--ink); }
.gauge .end { font-family: var(--fa); font-size: 10px; fill: var(--faint); }
.heat { display: grid; gap: 9px; min-width: 0; }
.hrow { display: grid; grid-template-columns: 62px minmax(0, 1fr) 36px; gap: 2px 8px; align-items: center; }
.hrow .tf { font-size: 12.5px; color: var(--mute); font-weight: 600; }
.hbar { position: relative; height: 8px; border-radius: 4px; background: var(--sunk); direction: ltr; }
.hbar::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--faint); opacity: .6; }
.hbar i { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
.hbar i.pos { left: 50%; background: var(--buy); } .hbar i.neg { right: 50%; background: var(--sell); }
.hrow .sc { font-size: 12px; text-align: end; }
.hrow .sub { grid-column: 2 / -1; font-size: 11px; color: var(--faint); line-height: 1.4; }

/* ---------- price ladder ---------- */
.rung { display: grid; grid-template-columns: minmax(0, 1fr) auto 64px 40px; gap: 10px; align-items: center; padding: 9px 2px; border-bottom: 1px dashed var(--line); font-size: 13.5px; }
.rung:last-child { border-bottom: 0; }
.rung .kind { color: var(--mute); }
.rung .p { font-size: 15px; text-align: end; } .rung .dd { font-size: 12px; color: var(--mute); text-align: end; }
.rung.res .p { color: var(--sell); } .rung.sup .p { color: var(--buy); }
.rung.now { background: var(--sun-soft); border-radius: 10px; border-bottom: 0; padding-inline: 10px; margin-block: 4px; font-weight: 700; }
.rung.now .p { color: var(--ink); }
.dots { display: inline-flex; gap: 3px; direction: ltr; justify-content: flex-start; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--mute); }

/* ---------- market mood ---------- */
.mood { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; align-content: start; min-width: 0; }
.stat .k { font-size: 12px; color: var(--mute); font-weight: 600; }
.stat .v { font-size: 18px; line-height: 1.4; }
.stat .h { font-size: 12px; color: var(--faint); line-height: 1.55; }

/* ---------- chart ---------- */
.seg { display: inline-flex; background: var(--sunk); border-radius: 12px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 9px; font-weight: 750; font-size: 13px; color: var(--mute); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .14); }
.chartbox { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
#chart { display: block; width: 100%; height: 360px; touch-action: pan-y; cursor: crosshair; direction: ltr; }
.ohlc { position: absolute; top: 6px; left: 10px; right: 10px; font-size: 11px; color: var(--mute); direction: ltr; pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--mute); }
.legend i { display: inline-block; width: 14px; height: 4px; border-radius: 2px; vertical-align: middle; margin-inline-end: 6px; }
.ind { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 380px) { .ind { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* ---------- stats ---------- */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kpi .v { font-size: 22px; }
.eqbox { position: relative; }
.eq { width: 100%; height: 150px; display: block; }
.eqlab { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--faint); margin-top: 4px; }
.trow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 12px; padding: 11px 2px; border-bottom: 1px solid var(--line); align-items: center; }
.trow:last-child { border-bottom: 0; }
.badge { font-size: 12px; font-weight: 800; padding: 2px 9px; border-radius: 6px; }
.badge.buy { color: var(--buy); background: var(--buy-soft); } .badge.sell { color: var(--sell); background: var(--sell-soft); }
.trow .res { font-size: 15px; text-align: end; }
.trow small { grid-column: 2 / -1; color: var(--faint); font-size: 12px; line-height: 1.5; }
.prose { font-size: 13.5px; line-height: 1.9; color: var(--mute); }
.prose p { margin: 0 0 8px; } .prose p:last-child { margin: 0; }

/* ---------- tools ---------- */
.form { display: grid; gap: 12px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 12.5px; color: var(--mute); font-weight: 650; }
.field input { width: 100%; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--sunk); padding: 0 12px; font-family: var(--mono); font-size: 16px; direction: ltr; text-align: left; }
.result { display: grid; gap: 7px; padding: 12px 14px; border-radius: 12px; background: var(--sunk); }
.result .row { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; align-items: baseline; flex-wrap: wrap; }
.result .row > span:first-child { white-space: nowrap; }
.result .warn { color: var(--sell); font-size: 13px; line-height: 1.7; }
.alist { display: grid; }
.arow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.arow:last-child { border-bottom: 0; }
.x { border: 0; background: var(--sunk); width: 34px; height: 34px; border-radius: 10px; cursor: pointer; color: var(--mute); font-size: 18px; line-height: 1; }
.setting { display: grid; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.setting:last-child { border-bottom: 0; }
.setting .k { font-size: 14px; font-weight: 700; } .setting .h { font-size: 12.5px; color: var(--faint); line-height: 1.6; }
.steps { margin: 0; padding-inline-start: 22px; display: grid; gap: 6px; font-size: 13.5px; line-height: 1.8; list-style: decimal; }
:root[lang="fa"] .steps { list-style: persian; }

/* ---------- tabs & toast ---------- */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs-in { display: grid; grid-template-columns: repeat(4, 1fr); }
.tabs a { display: grid; justify-items: center; gap: 1px; padding: 8px 0 7px; text-decoration: none; color: var(--faint); font-size: 11.5px; font-weight: 700; position: relative; }
.tabs svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tabs a[aria-current="page"] { color: var(--ink); }
.tabs a[aria-current="page"]::before { content: ""; position: absolute; top: -1px; width: 30px; height: 3px; border-radius: 0 0 3px 3px; background: var(--sun); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(78px + env(safe-area-inset-bottom, 0px)); z-index: 40; width: max-content; max-width: min(520px, calc(100vw - 32px)); background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; box-shadow: var(--shadow); }

/* ---------- laptop and desktop: signal beside the chart, context row below, tabs in the header ---------- */
.s-main, .s-ctx, .blk, .col { display: grid; gap: 14px; min-width: 0; align-content: start; }
@media (min-width: 1000px) {
  .wrap { max-width: 1240px; }
  main { padding-block: 22px 48px; }
  .px .big { font-size: 38px; }
  main.duo { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); grid-template-areas: "tk ch" "cx cx"; gap: 22px; align-items: start; }
  main.duo > #v-signal { display: contents; }
  main.duo .s-main { grid-area: tk; }
  main.duo > #v-chart { grid-area: ch; }
  main.duo .s-ctx { grid-area: cx; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; align-items: start; }
  main.duo .s-ctx > .blk:nth-child(3), main.duo .s-note { grid-column: 1 / -1; }
  main.duo .s-ctx > .blk:nth-child(3) .mood { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  main.duo .only-narrow { display: none; }
  #chart { height: 468px; }
  #v-stats, #v-tools { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; align-items: start; }
  .col > .sec:first-child { margin-top: 0; }
  .tabs { top: calc(env(safe-area-inset-top, 0px) + 9px); bottom: auto; left: 50%; right: auto; transform: translateX(-50%); background: var(--sunk); border: 0; border-radius: 12px; padding: 3px; }
  .tabs-in { display: flex; gap: 2px; max-width: none; padding-left: 0; padding-right: 0; }
  .tabs a { display: flex; align-items: center; gap: 7px; padding: 6px 14px; border-radius: 9px; font-size: 13px; color: var(--mute); }
  .tabs a:hover { color: var(--ink); }

  // --------------------------------------------------------------- indicators
  function sma(src, n) {

    return out;

  function smooth(src, n, alpha) {
    var len = src.length, out = nanArr(len), s = firstValid(src), i;
    if (s < 0 || s + n > len) return out;

    for (i = s + n; i < len; i++) { prev = alpha * src[i] + (1 - alpha) * prev; out[i] = prev; }
    return out;
  }
  function ema(src, n) { return smooth(src, n, 2 / (n + 1)); }
  function rma(src, n) { return smooth(src, n, 1 / n); }

  function rsi(close, n) {
    var len = close.length, out = nanArr(len), i, d;

  function macd(close, fast, slow, sig) {

    var lt = isNum(e200) ? sign(close - e200) * (Math.abs(close - e200) > 0.002 * close ? 1 : 0.5) : 0;
    var st = isNum(I.stDir[j]) ? I.stDir[j] : 0;
    var mc = 0.5 * sign(I.hist[j]) + 0.5 * sign(I.hist[j] - I.hist[j - 1]);
    var rs = clamp((I.rsi[j] - 50) / 20, -1, 1);
    var w = isNum(e200) ? [0.30, 0.15, 0.20, 0.20, 0.15] : [0.35, 0, 0.225, 0.225, 0.20];
    var score = Math.round(100 * (w[0] * stack + w[1] * lt + w[2] * st + w[3] * mc + w[4] * rs));
    return {
      score: score, label: trendLabel(score), rsi: I.rsi[j], adx: I.adx[j], regime: regimeLabel(I.adx[j]),
      close: close, ema21: e21, ema50: e50, ema200: e200, stDir: st, hist: I.hist[j],
      atrPct: I.atr[j] / close * 100, t: cs[j].t
    };
  }

  // -------------------------------------------------------------- the context
  function alignMap(base, other) {
    var out = new Array(base.length), j = -1;
    for (var i = 0; i < base.length; i++) {
      while (j + 1 < other.length && other[j + 1].T <= base[i].T) j++;
      out[i] = j;
    }
    return out;
  }

  // data: { h1, h4, d1, btc4h } arrays of CLOSED candles, oldest first
  function buildContext(data) {
    var ctx = { h1: data.h1 || [], h4: data.h4 || [], d1: data.d1 || [], btc: (data.btc4h && data.btc4h.length) ? data.btc4h : null };
    ctx.i1 = computeIndicators(ctx.h1);
    ctx.i4 = computeIndicators(ctx.h4);
    ctx.iD = computeIndicators(ctx.d1);
    ctx.iB = ctx.btc ? computeIndicators(ctx.btc) : null;
    ctx.map4 = alignMap(ctx.h1, ctx.h4);
    ctx.mapD = alignMap(ctx.h1, ctx.d1);
    ctx.mapB = ctx.btc ? alignMap(ctx.h1, ctx.btc) : null;
    ctx.piv1z = pivots(ctx.i1.high, ctx.i1.low, 5, 5);
    ctx.piv1f = pivots(ctx.i1.high, ctx.i1.low, 3, 3);
    ctx.piv4 = pivots(ctx.i4.high, ctx.i4.low, 3, 3);
    ctx.pivD = pivots(ctx.iD.high, ctx.iD.low, 3, 3);
    return ctx;
  }

  // ------------------------------------------------- support / resistance zones
  function collectPivots(out, piv, at, lookback, weight) {
    if (at < 0) return;
    for (var p = 0; p < piv.length; p++) {
      var q = piv[p];
      if (q.confirm > at) break;
      if (q.k < at - lookback) continue;
      var age = (at - q.k) / lookback;
      out.push({ price: q.price, w: weight * (age < 0.5 ? 1 : 0.6), tf: weight });
    }
  }

  function zonesAt(ctx, i, price) {
    var atr = ctx.i1.atr[i], pts = [];
    collectPivots(pts, ctx.piv1z, i, 300, 1);
    collectPivots(pts, ctx.piv4, ctx.map4[i], 150, 2);
    collectPivots(pts, ctx.pivD, ctx.mapD[i], 180, 3);
    var tol = Math.max(price * 0.004, isNum(atr) ? atr * 0.6 : 0);
    pts = pts.filter(function (p) { return Math.abs(p.price - price) / price <= 0.30; });
    pts.sort(function (a, b) { return a.price - b.price; });
    var zones = [], cur = null;
    for (var k = 0; k < pts.length; k++) {
      var p = pts[k];
      if (cur && Math.abs(p.price - cur.price) <= tol) {
        cur.sw += p.w; cur.sp += p.price * p.w; cur.price = cur.sp / cur.sw;
        cur.lo = Math.min(cur.lo, p.price); cur.hi = Math.max(cur.hi, p.price);
        cur.touches++; cur.tf = Math.max(cur.tf, p.tf);
      } else {
        cur = { price: p.price, lo: p.price, hi: p.price, sw: p.w, sp: p.price * p.w, touches: 1, tf: p.tf };
        zones.push(cur);
      }
    }
    var sup = [], res = [];
    for (k = 0; k < zones.length; k++) {
      var z = zones[k];
      var zz = { price: z.price, lo: z.lo, hi: z.hi, strength: round(z.sw, 1), touches: z.touches, tf: z.tf };
      if (z.price < price) sup.push(zz); else res.push(zz);
    }
    sup.sort(function (a, b) { return b.price - a.price; });
    res.sort(function (a, b) { return a.price - b.price; });
    function pick(list) {
      var strong = list.filter(function (z) { return z.strength >= 2; });
      if (strong.length < 2) strong = list.filter(function (z) { return z.strength >= 1; });
      return strong.slice(0, 4);
    }
    return { supports: pick(sup), resistances: pick(res) };
  }

  // ---------------------------------------------------------- RSI divergence
  function lastTwo(piv, type, i, lookback) {
    var found = [];
    for (var p = piv.length - 1; p >= 0 && found.length < 2; p--) {
      var q = piv[p];
      if (q.confirm > i || q.type !== type) continue;
      if (q.k < i - lookback) break;
      found.push(q);
    }
    return found.length === 2 ? { p2: found[0], p1: found[1] } : null;
  }
  function divergenceAt(ctx, i) {
    var r = ctx.i1.rsi, piv = ctx.piv1f;
    var lows = lastTwo(piv, -1, i, 50);
    if (lows && lows.p2.confirm >= i - 6 && lows.p2.k - lows.p1.k >= 5 && lows.p2.price < lows.p1.price &&
      r[lows.p2.k] > r[lows.p1.k] + 2 && r[lows.p2.k] < 45) return 1;
    var highs = lastTwo(piv, 1, i, 50);
    if (highs && highs.p2.confirm >= i - 6 && highs.p2.k - highs.p1.k >= 5 && highs.p2.price > highs.p1.price &&
      r[highs.p2.k] < r[highs.p1.k] - 2 && r[highs.p2.k] > 55) return -1;
    return 0;
  }

  // ------------------------------------------------------------------ setups
  var BASE_CONF = { pullback: 52, breakout: 48, reversal: 40 };

  function anyBar(from, to, fn) { for (var k = Math.max(0, from); k <= to; k++) { if (fn(k)) return true; } return false; }

  function nearZone(list, price, atr) {
    for (var z = 0; z < list.length; z++) {
      if (price >= list[z].lo - 0.6 * atr && price <= list[z].hi + 0.6 * atr) return list[z];
    }
    return null;
  }

  function detect(ctx, i, h4, zones) {
    var I = ctx.i1, atr = I.atr[i], cl = I.close[i], op = I.open[i], hi = I.high[i], lo = I.low[i];
    var range = hi - lo, pos = range > 0 ? (cl - lo) / range : 0.5;
    var r = I.rsi[i], rP = I.rsi[i - 1], hist = I.hist[i], histP = I.hist[i - 1];
    var e21 = I.ema21[i], e50 = I.ema50[i];
    var volR = I.volSma[i - 1] > 0 ? I.vol[i] / I.volSma[i - 1] : 1;
    var hh20 = maxOf(I.high, i - 20, i - 1), ll20 = minOf(I.low, i - 20, i - 1);
    var hh20p = maxOf(I.high, i - 21, i - 2), ll20p = minOf(I.low, i - 21, i - 2);
    var minR6 = minOf(I.rsi, i - 6, i - 1), maxR6 = maxOf(I.rsi, i - 6, i - 1);
    var adxNow = I.adx[i];
    var c = [];
    if (!isNum(atr) || !isNum(r) || !isNum(rP) || !isNum(hist) || !isNum(histP) || !isNum(e50)) return { list: c, volR: volR };
    var h4s = h4 ? h4.score : 0;

    // ---- long side
    if (h4 && h4s >= 25 && h4.close > h4.ema50 && (e21 > e50 || cl > e50) && minR6 <= 48 &&
      anyBar(i - 5, i, function (k) { return I.low[k] <= I.ema21[k] + 0.25 * atr; }) &&
      cl > e21 && cl > op && pos >= 0.55 && hist > histP && r > rP && r >= 45 && r <= 68 && (cl - e21) <= 1.2 * atr) {
      c.push({ dir: 1, type: 'pullback', why: [[R('h4Up', fmtSigned(h4s)), 1], [R('pbLong'), 1], [R('momUp'), 1]] });
    }
    if (cl > hh20 && cl - hh20 <= 1.0 * atr && I.close[i - 1] <= hh20p && volR >= 1.5 && pos >= 0.6 && r <= 75 &&
      (!h4 || h4s >= 0) && adxNow >= 15) {
      c.push({ dir: 1, type: 'breakout', why: [[R('bkHigh', fmtPrice(hh20)), 1], [R('bkVol', volR.toFixed(1)), 1]] });
    }
    if (minR6 <= 30 && r > 35 && r > rP && cl > op && pos >= 0.6 && (!h4 || h4s > -60)) {
      var lowMin = minOf(I.low, i - 6, i);
      var sz = nearZone(zones().supports, lowMin, atr);
      var bbTouch = anyBar(i - 6, i, function (k) { return I.low[k] <= I.bbLo[k]; });
      if (sz || bbTouch) {
        c.push({ dir: 1, type: 'reversal', why: [[R('rsiOS'), 1], [sz ? R('supReact', fmtPrice(sz.price)) : R('bbLow'), 1]] });
      }
    }

    // ---- short side
    if (h4 && h4s <= -25 && h4.close < h4.ema50 && (e21 < e50 || cl < e50) && maxR6 >= 52 &&
      anyBar(i - 5, i, function (k) { return I.high[k] >= I.ema21[k] - 0.25 * atr; }) &&
      cl < e21 && cl < op && pos <= 0.45 && hist < histP && r < rP && r <= 55 && r >= 32 && (e21 - cl) <= 1.2 * atr) {
      c.push({ dir: -1, type: 'pullback', why: [[R('h4Down', fmtSigned(h4s)), 1], [R('pbShort'), 1], [R('momDown'), 1]] });
    }
    if (cl < ll20 && ll20 - cl <= 1.0 * atr && I.close[i - 1] >= ll20p && volR >= 1.5 && pos <= 0.4 && r >= 25 &&
      (!h4 || h4s <= 0) && adxNow >= 15) {
      c.push({ dir: -1, type: 'breakout', why: [[R('bkLow', fmtPrice(ll20)), 1], [R('bkVol', volR.toFixed(1)), 1]] });
    }
    if (maxR6 >= 70 && r < 65 && r < rP && cl < op && pos <= 0.4 && (!h4 || h4s < 60)) {
      var highMax = maxOf(I.high, i - 6, i);
      var rz = nearZone(zones().resistances, highMax, atr);
      var bbTouchU = anyBar(i - 6, i, function (k) { return I.high[k] >= I.bbUp[k]; });
      if (rz || bbTouchU) {
        c.push({ dir: -1, type: 'reversal', why: [[R('rsiOB'), 1], [rz ? R('resReject', fmtPrice(rz.price)) : R('bbHigh'), 1]] });
      }
    }
    return { list: c, volR: volR };
  }

  function levelsFor(ctx, i, dir, zones) {
    var I = ctx.i1, atr = I.atr[i], entry = I.close[i];
    var ext = dir > 0 ? minOf(I.low, i - 11, i) : maxOf(I.high, i - 11, i);
    var dist = dir > 0 ? entry - ext + 0.25 * atr : ext - entry + 0.25 * atr;
    dist = clamp(dist, 1.2 * atr, 2.8 * atr);
    var stop = entry - dir * dist;
    var tps = [entry + dir * dist, entry + dir * 2 * dist, entry + dir * 3 * dist];
    var zone = dir > 0 ? [entry - 0.35 * atr, entry + 0.15 * atr] : [entry - 0.15 * atr, entry + 0.35 * atr];
    var opp = dir > 0 ? zones.resistances : zones.supports, room = Infinity, roomAt = null;
    for (var z = 0; z < opp.length; z++) {
      if (opp[z].strength < 2) continue;
      var d = dir > 0 ? opp[z].lo - entry : entry - opp[z].hi;
      if (d > 0.1 * atr && d < room) { room = d; roomAt = opp[z].price; }
    }
    return { entry: entry, zone: zone, stop: stop, tps: tps, R: dist, roomR: room / dist, roomAt: roomAt, atr: atr };
  }

  function weightedBias(parts) {
    var s = 0, w = 0;
    for (var k = 0; k < parts.length; k++) { if (parts[k][0]) { s += parts[k][0].score * parts[k][1]; w += parts[k][1]; } }
    return w ? Math.round(s / w) : 0;
  }

  // Main entry: analysis of closed 1h candle i. opts.minConf is the alert threshold.
  function evaluate(ctx, i, opts) {
    opts = opts || {};
    var minConf = isNum(opts.minConf) ? opts.minConf : 62;
    var I = ctx.i1, cs = ctx.h1;
    if (i < 60 || i >= cs.length) return null;
    var h1 = tfInfo(cs, I, i);
    if (!h1) return null;
    var h4 = ctx.map4[i] >= 0 ? tfInfo(ctx.h4, ctx.i4, ctx.map4[i]) : null;
    var d1 = ctx.mapD[i] >= 0 ? tfInfo(ctx.d1, ctx.iD, ctx.mapD[i]) : null;
    var btc = (ctx.mapB && ctx.mapB[i] >= 0) ? tfInfo(ctx.btc, ctx.iB, ctx.mapB[i]) : null;
    var bias = weightedBias([[h1, 0.4], [h4, 0.4], [d1, 0.2]]);
    var zc = null;
    function zones() { if (!zc) zc = zonesAt(ctx, i, I.close[i]); return zc; }
    var det = detect(ctx, i, h4, zones), best = null;
    var div = det.list.length ? divergenceAt(ctx, i) : 0;

    for (var k = 0; k < det.list.length; k++) {
      var cd = det.list[k], dir = cd.dir, conf = BASE_CONF[cd.type], why = cd.why.slice();
      var aligned = dir * bias;
      conf += 0.30 * aligned;
      why.push([R('bias', trendLabel(bias).toLowerCase(), fmtSigned(bias)), aligned >= 0 ? 1 : -1]);
      if (det.volR >= 1.3 && cd.type !== 'breakout') { conf += 4; why.push([R('vol', det.volR.toFixed(1)), 1]); }
      if (div === dir) { conf += 8; why.push([R(dir > 0 ? 'divBull' : 'divBear'), 1]); }
      if (d1) {
        if (dir * d1.score >= 20) { conf += 4; why.push([R('d1With'), 1]); }
        else if (dir * d1.score <= -50) { conf -= 8; why.push([R('d1Against'), -1]); }
      }
      if (btc) {
        if (dir * btc.score >= 20) { conf += 4; why.push([R('btcWith'), 1]); }
        else if (dir * btc.score <= -50) { conf -= 8; why.push([R('btcAgainst'), -1]); }
      }
      var lv = levelsFor(ctx, i, dir, zones());
      if (lv.roomR >= 2) { conf += 4; why.push([R(dir > 0 ? 'roomUp' : 'roomDown'), 1]); }
      else if (lv.roomR < 1) { conf -= 10; why.push([R(dir > 0 ? 'nearRes' : 'nearSup', fmtPrice(lv.roomAt)), -1]); }
      if (dir > 0 && I.rsi[i] > 70) { conf -= 8; why.push([R('rsiHigh', I.rsi[i].toFixed(0)), -1]); }
      if (dir < 0 && I.rsi[i] < 30) { conf -= 8; why.push([R('rsiLow', I.rsi[i].toFixed(0)), -1]); }
      conf = Math.round(clamp(conf, 5, 95));
      var cand = {
        dir: dir, type: cd.type, name: setupName(cd.type, dir), conf: conf,
        entry: lv.entry, zone: lv.zone, stop: lv.stop, tps: lv.tps, R: lv.R, atr: lv.atr,
        roomR: lv.roomR, reasons: why, t: cs[i].t, T: cs[i].T, i: i
      };
      if (!best || cand.conf > best.conf) best = cand;
    }
    return {
      i: i, t: cs[i].t, T: cs[i].T, close: I.close[i], atr: I.atr[i], rsi: I.rsi[i],
      tf: { h1: h1, h4: h4, d1: d1, btc: btc }, bias: bias, biasLabel: trendLabel(bias),
      setup: best, signal: (best && best.conf >= minConf) ? best : null, minConf: minConf,
      zones: opts.withZones ? zones() : null
    };
  }

  // ---------------------------------------------------------------- backtest
  // Mirrors what the bot does: one trade at a time, entry at the next candle's open,
  // a third closed at each target, stop to entry after TP1 and to TP1 after TP2,
  // exit after maxHold hours. If a candle touches both stop and target, the stop wins.
  function openTrade(sig, bar, idx, feePct) {
    var entry = bar.o, R = Math.abs(entry - sig.stop);
    if (!(R > 0.3 * sig.atr) || (sig.dir > 0 ? entry <= sig.stop : entry >= sig.stop)) return null;
    return {
      dir: sig.dir, type: sig.type, name: sig.name, conf: sig.conf, sigT: sig.t,
      entryI: idx, entryT: bar.t, entry: entry, stop: sig.stop, stopNow: sig.stop, R: R,
      tps: [entry + sig.dir * R, entry + sig.dir * 2 * R, entry + sig.dir * 3 * R],
      hit: 0, left: 1, gross: 0, exits: [], feeR: (2 * feePct / 100) * entry / R, closed: false
    };
  }
  function exitPart(p, px, part, t, why) {
    p.gross += part * p.dir * (px - p.entry) / p.R;
    p.left = round(p.left - part, 6);
    p.exits.push({ px: px, part: part, t: t, why: why });
    if (p.left <= 1e-6) { p.closed = true; p.exitT = t; p.reason = why; }
  }
  function manageBar(p, b, idx, maxHold) {
    var d = p.dir;
    if (d > 0 ? b.l <= p.stopNow : b.h >= p.stopNow) {
      var px = d > 0 ? Math.min(p.stopNow, b.o) : Math.max(p.stopNow, b.o);
      exitPart(p, px, p.left, b.t, p.hit === 0 ? 'stop' : (p.hit === 1 ? 'be' : 'trail'));
      return;
    }
    for (var k = p.hit; k < 3; k++) {
      var tp = p.tps[k];
      if (!(d > 0 ? b.h >= tp : b.l <= tp)) break;
      var fill = d > 0 ? Math.max(tp, b.o) : Math.min(tp, b.o);
      exitPart(p, fill, k === 2 ? p.left : 1 / 3, b.t, 'tp' + (k + 1));
      p.hit = k + 1;
      if (k === 0) p.stopNow = p.entry;
      if (k === 1) p.stopNow = p.tps[0];
      if (p.closed) return;
    }
    if (idx - p.entryI + 1 >= maxHold) exitPart(p, b.c, p.left, b.t, 'time');
  }

  function backtest(ctx, opts) {
    opts = Object.assign({ mode: 'spot', minConf: 62, feePct: 0.1, maxHold: 72, start: 220, riskPct: 1 }, opts || {});
    var cs = ctx.h1, n = cs.length, trades = [], pos = null, lastEval = null, pending = null, signals = [];
    var start = Math.max(60, opts.start);
    for (var i = start; i < n; i++) {
      if (pos && i >= pos.entryI) {
        manageBar(pos, cs[i], i, opts.maxHold);
        if (pos.closed) { trades.push(finishTrade(pos)); pos = null; }
      }
      var ev = evaluate(ctx, i, { minConf: opts.minConf });
      if (i === n - 1) lastEval = ev;
      if (!ev || !ev.signal) continue;
      var sig = ev.signal, allowed = sig.dir > 0 || opts.mode === 'futures';
      var prevSig = signals.length ? signals[signals.length - 1] : null;
      if (!prevSig || prevSig.dir !== sig.dir || sig.t - prevSig.t > 6 * MS['1h']) {
        signals.push({ t: sig.t, T: sig.T, i: i, dir: sig.dir, conf: sig.conf, entry: sig.entry, name: sig.name });
      }
      if (i + 1 >= n) { pending = sig; continue; }
      if (pos && pos.dir !== sig.dir) {
        exitPart(pos, cs[i + 1].o, pos.left, cs[i + 1].t, 'opposite');
        trades.push(finishTrade(pos)); pos = null;
      }
      if (!pos && allowed) pos = openTrade(sig, cs[i + 1], i + 1, opts.feePct);
    }
    var stats = summarize(trades, opts.riskPct, cs, start);
    return { trades: trades, stats: stats, open: pos, pending: pending, lastEval: lastEval, signals: signals, opts: opts };
  }
  function finishTrade(p) {
    var r = p.gross - p.feeR;
    var px = 0; for (var k = 0; k < p.exits.length; k++) px += p.exits[k].px * p.exits[k].part;
    return {
      dir: p.dir, type: p.type, name: p.name, conf: p.conf, sigT: p.sigT, entryT: p.entryT, entry: p.entry,
      stop: p.stop, tps: p.tps, exitT: p.exitT, exitPx: px, r: round(r, 3), hit: p.hit, reason: p.reason,
      hours: Math.round((p.exitT - p.entryT) / MS['1h']) + 1
    };
  }
  function summarize(trades, riskPct, cs, start) {
    var n = trades.length, wins = 0, sumW = 0, sumL = 0, cum = 0, peak = 0, dd = 0, eq = 1, curve = [{ t: cs.length ? cs[Math.min(start, cs.length - 1)].t : 0, r: 0, eq: 1 }];
    var best = -Infinity, worst = Infinity, hours = 0, longs = 0;
    for (var k = 0; k < n; k++) {
      var r = trades[k].r;
      if (r > 0) { wins++; sumW += r; } else sumL += -r;
      cum += r; peak = Math.max(peak, cum); dd = Math.max(dd, peak - cum);
      eq *= 1 + (riskPct / 100) * r;
      best = Math.max(best, r); worst = Math.min(worst, r); hours += trades[k].hours;
      if (trades[k].dir > 0) longs++;
      curve.push({ t: trades[k].exitT, r: round(cum, 3), eq: eq });
    }
    var days = cs.length > start ? (cs[cs.length - 1].T - cs[start].t) / MS['1d'] : 0;
    return {
      trades: n, wins: wins, losses: n - wins, winRate: n ? wins / n * 100 : 0,
      avgR: n ? cum / n : 0, totalR: cum, profitFactor: sumL > 0 ? sumW / sumL : (sumW > 0 ? Infinity : 0),
      maxDD: dd, equityPct: (eq - 1) * 100, best: n ? best : 0, worst: n ? worst : 0,
      avgHours: n ? hours / n : 0, longs: longs, shorts: n - longs, days: days, curve: curve
    };
  }

  // ------------------------------------------------------------- extra tools
  function positionSize(capital, riskPct, entry, stop) {
    if (!(capital > 0) || !(riskPct > 0) || !(entry > 0) || !(stop > 0) || entry === stop) return null;
    var riskAmt = capital * riskPct / 100, per = Math.abs(entry - stop), qty = riskAmt / per, notional = qty * entry;
    return { riskAmt: riskAmt, qty: qty, notional: notional, pctOfCapital: notional / capital * 100, leverage: notional / capital, stopPct: per / entry * 100 };
  }

  // depth: Binance /depth payload. Finds the biggest resting orders near the price.
  function orderBookWalls(depth, price) {
    if (!depth || !depth.bids || !depth.asks || !(price > 0)) return null;
    var step = Math.max(price * 0.001, 0.0001);
    function bucket(rows, side) {
      var map = {}, tot1 = 0, tot3 = 0;
      for (var k = 0; k < rows.length; k++) {
        var p = +rows[k][0], q = +rows[k][1], dist = side * (price - p) / price;
        if (dist < 0 || dist > 0.03) continue;
        if (dist <= 0.01) tot1 += q;
        tot3 += q;
        var key = (Math.floor(p / step) * step).toFixed(8);
        map[key] = (map[key] || 0) + q;
      }
      var arr = Object.keys(map).map(function (kk) { return { price: +kk + (side > 0 ? 0 : step), qty: map[kk] }; });
      arr.sort(function (a, b) { return b.qty - a.qty; });

    return { bids: b.top, asks: a.top, bidQty1: b.near, askQty1: a.near, bidQty3: b.all, askQty3: a.all, imbalance: imb };

  const off = Math.max(0, base.length - n), vis = base.slice(off);
  const lv = tradeLevels();
  let lo = Infinity, hi = -Infinity;
  vis.forEach((c) => { if (c.l < lo) lo = c.l; if (c.h > hi) hi = c.h; });
  lv.forEach((l) => { if (l.p > lo * 0.96 && l.p < hi * 1.04) { lo = Math.min(lo, l.p); hi = Math.max(hi, l.p); } });
  const pad = (hi - lo) * 0.06; lo -= pad; hi += pad;
  const y = (p) => padT + (hi - p) / (hi - lo) * (HH - padT - padB);
  const x = (k) => padL + k * step + step / 2;
  const right = W - padR;
  S.layout = { padL, step, vis, right };
  g.font = `500 10.5px ${C('--mono')}`; g.textBaseline = 'middle'; g.lineWidth = 1;
  const st = niceStep((hi - lo) / 5);
  for (let p = Math.ceil(lo / st) * st; p <= hi; p += st) {
    const yy = Math.round(y(p)) + 0.5;
    g.strokeStyle = C('--line'); g.beginPath(); g.moveTo(padL, yy); g.lineTo(right + 4, yy); g.stroke();
    g.fillStyle = C('--faint'); g.textAlign = 'left'; g.fillText(fp(p), right + 8, yy);
  }
  const z = S.ev && S.ev.zones, atr = S.ev ? S.ev.atr : 0;
  if (z) {
    [[z.supports, '--buy-soft', '--buy'], [z.resistances, '--sell-soft', '--sell']].forEach(([list, fill, edge]) => list.forEach((zz) => {
      const top = y(zz.hi + atr * 0.12), bot = y(zz.lo - atr * 0.12);
      if (bot < padT || top > HH - padB) return;
      g.fillStyle = C(fill); g.fillRect(padL, top, right - padL, Math.max(3, bot - top));
      g.strokeStyle = C(edge); g.globalAlpha = 0.35; g.beginPath(); g.moveTo(padL, Math.round(top) + 0.5); g.lineTo(right, Math.round(top) + 0.5); g.stroke(); g.globalAlpha = 1;
    }));
  }
  const line = (arr, col, w) => {
    g.strokeStyle = col; g.lineWidth = w; g.beginPath(); let started = false;
    for (let k = 0; k < vis.length; k++) { const v = arr[off + k]; if (!(v > 0)) continue; const yy = y(v); if (!started) { g.moveTo(x(k), yy); started = true; } else g.lineTo(x(k), yy); }
    g.stroke(); g.lineWidth = 1;
  };
  line(I.ema50, C('--mute'), 1.2); line(I.ema21, C('--sun'), 1.6);
  vis.forEach((c, k) => {
    const up = c.c >= c.o, col = up ? C('--buy') : C('--sell'), xx = Math.round(x(k)) + 0.5;
    g.strokeStyle = col; g.fillStyle = col;
    g.beginPath(); g.moveTo(xx, y(c.h)); g.lineTo(xx, y(c.l)); g.stroke();
    const yo = y(c.o), yc = y(c.c);
    g.fillRect(xx - 2.5, Math.min(yo, yc), 5, Math.max(1, Math.abs(yc - yo)));
  });
  if (S.chartTf === '1h' && S.bt) {
    const idx = new Map(vis.map((c, k) => [c.t, k]));
    S.bt.signals.forEach((s) => {
      const k = idx.get(s.t); if (k == null) return;
      const c = vis[k], xx = x(k), yy = s.dir > 0 ? y(c.l) + 9 : y(c.h) - 9, d = s.dir > 0 ? 1 : -1;
      g.fillStyle = s.dir > 0 ? C('--buy') : C('--sell');
      g.beginPath(); g.moveTo(xx, yy - 5 * d); g.lineTo(xx - 5, yy + 4 * d); g.lineTo(xx + 5, yy + 4 * d); g.closePath(); g.fill();
    });
  }
  const tag = (yy, text, bg, fg) => {
    const w = g.measureText(text).width + 10;
    g.fillStyle = bg; g.beginPath(); g.roundRect ? g.roundRect(right + 3, yy - 9, w, 18, 4) : g.rect(right + 3, yy - 9, w, 18); g.fill();
    g.fillStyle = fg; g.textAlign = 'left'; g.fillText(text, right + 8, yy);
  };
  lv.forEach((l) => {
    if (l.p < lo || l.p > hi) return;
    const yy = Math.round(y(l.p)) + 0.5;
    g.setLineDash([5, 4]); g.strokeStyle = l.c; g.beginPath(); g.moveTo(padL, yy); g.lineTo(right, yy); g.stroke(); g.setLineDash([]);
    g.fillStyle = l.c; g.textAlign = 'right'; g.fillText(l.l, right - 4, yy - 8);
  });
  const lastP = S.price || vis[vis.length - 1].c;
  if (lastP >= lo && lastP <= hi) {
    const yy = Math.round(y(lastP)) + 0.5;
    g.strokeStyle = C('--sun'); g.setLineDash([2, 3]); g.beginPath(); g.moveTo(padL, yy); g.lineTo(right, yy); g.stroke(); g.setLineDash([]);
    tag(yy, fp(lastP), C('--sun'), C('--on-st'));
  }
  g.fillStyle = C('--faint'); g.textAlign = 'center';
  const nLab = Math.max(3, Math.min(7, Math.floor((right - padL) / 140)));
  const every = Math.max(1, Math.ceil(vis.length / nLab)), withDay = every >= 12;
  for (let k = vis.length - 1 - Math.floor(every / 2); k >= 0; k -= every) {
    const d = new Date(vis[k].t);
    const txt = S.chartTf === '1h' ? (withDay ? fmtMD.format(d) + ' ' + fmtHM.format(d) : fmtHM.format(d)) : fmtMD.format(d);
    const half = g.measureText(txt).width / 2 + 2;
    g.fillText(txt, Math.max(padL + half, Math.min(right - half, x(k))), HH - padB / 2);
  }
  const hv = S.hover;
  const show = hv != null && vis[hv] ? vis[hv] : vis[vis.length - 1];
  if (hv != null && vis[hv]) { g.strokeStyle = C('--faint'); g.beginPath(); g.moveTo(Math.round(x(hv)) + 0.5, padT); g.lineTo(Math.round(x(hv)) + 0.5, HH - padB); g.stroke(); }
  const ch = (show.c / show.o - 1) * 100;
  const sd = new Date(show.t);
  $('#ohlc').textContent = `${S.chartTf === '1h' ? (W > 520 ? fmtMD.format(sd) + ' ' : '') + fmtHM.format(sd) : fmtMD.format(sd)}  O ${fp(show.o)}  H ${fp(show.h)}  L ${fp(show.l)}  C ${fp(show.c)}  ${pc(ch, 2)}`;
}

  const d = rs.map((r, k) => (k ? 'L' : 'M') + X(k).toFixed(1) + ' ' + Y(r).toFixed(1)).join(' ');
  const end = rs[rs.length - 1], col = end >= 0 ? 'var(--buy)' : 'var(--sell)', z = Y(0).toFixed(1);
  return `<svg class="eq" viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none" role="img" aria-label="${t('eqAria')}">
    <line x1="0" x2="${W}" y1="${z}" y2="${z}" stroke="var(--line)" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>

function calcUpdate() {

  S.set.capital = cap; S.set.risk = risk; store.set('set', S.set);
  const dir = entry > stop ? 1 : -1, tps = S.calc && S.calc.tps && S.calc.entry === entry ? S.calc.tps : [1, 2, 3].map((k) => entry + dir * k * Math.abs(entry - stop));

  const rows = [

    [t('c_value'), `${N(r.notional.toFixed(2))} ${t('usdt')} <span class="faint">${t('c_ofCap', N(r.pctOfCapital.toFixed(0) + '%'))}</span>`],
    [t('c_loss'), `<span class="down">${N('−' + r.riskAmt.toFixed(2))} ${t('usdt')}</span>`],
    [t('c_dist'), N(r.stopPct.toFixed(2) + '%')]
  ].concat(tps.map((tp, k) => [t('c_gain', dg(k + 1)), `<span class="up">${N('+' + (r.qty * Math.abs(tp - entry)).toFixed(2))} ${t('usdt')}</span>`]));
  let warn = '';
  if (r.leverage > 1 && S.set.mode === 'spot') warn = `<div class="warn">${t('c_overSpot', N((cap / entry).toFixed(3)), N((cap / entry * Math.abs(entry - stop) / cap * 100).toFixed(2) + '%'))}</div>`;

}

    const h1 = E.closedOnly(S.h1, Date.now());
    if (h1.length && h1[h1.length - 1].t !== S.lastClosedT) { analyze(false); render(); }
    else {
      const m15 = E.closedOnly(S.m15, Date.now());
      if (m15.length > 80) S.tf15 = E.tfInfo(m15, E.computeIndicators(m15), m15.length - 1);
      scheduleRender();
    }
    if (S.live === 'off') setLive('poll');
  } catch (e) { if (S.live !== 'live') setLive('off'); }
  finally { refreshing = false; }
}
setInterval(() => {
  document.querySelectorAll('[data-countdown]').forEach((el) => { el.textContent = countdown(); });
  const sinceClose = Date.now() % H;
  if (S.status === 'ok' && sinceClose > 8000 && sinceClose < 15000 && Date.now() - (S.lastRefresh || 0) > 20000) refresh();
}, 1000);

async function boot() {
  S.status = 'loading'; applyTheme(); route();
  try { await loadAll(); analyze(true); if (S.status === 'loading') S.status = 'ok'; }
  catch (e) { S.status = 'error'; S.err = String(e && e.message || e); setLive('off'); render(); return; }
  render();
  if (!ws) connectWS();
  loadExtras();
  if (!boot.started) {
    boot.started = true;
    setInterval(refresh, 60000);
    setInterval(loadExtras, 5 * 60000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { setBadge(false); refresh(); loadExtras(); } });
  }
}
applyLang(S.set.lang || deviceLang());
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
boot();
})();
</script>
